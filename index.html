<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#ffb300}
@property --c2{syntax:'<color>';inherits:true;initial-value:#ff6d00}
:root{--ink:#1c1622;--glass:#ffffff00;--glass-blur:9px;--edge:#ffffff66;--bg:#f1eaf5;--c1:#ffb300;--c2:#ff6d00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:--c1 .9s,--c2 .9s}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f7f1fb;--glass:#ffffff1a;--edge:#ffffff40;--bg:#120e18}}
:root[data-theme="dark"]{--ink:#f7f1fb;--glass:#ffffff1a;--edge:#ffffff40;--bg:#120e18}
html,body{height:100%;margin:0}
body{font:500 15px/1.35 Onest,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 25% 22%,var(--c1),transparent 70%),radial-gradient(55% 45% at 80% 48%,var(--c2),transparent 70%);opacity:.6}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#ffffff18,#ffffff08 42%,#ffffff12),var(--glass);background-color:var(--glass);-webkit-backdrop-filter:blur(var(--glass-blur,9px)) saturate(1.5);backdrop-filter:blur(var(--glass-blur,9px)) saturate(1.5);border:1px solid #ffffff42;box-shadow:inset 0 1px 0 #ffffff70,inset 0 -1px 0 #ffffff16,0 16px 40px #0002;border-radius:24px;transform:translateZ(0)}
.glass::before{content:"";position:absolute;inset:-28%;z-index:-1;pointer-events:none;opacity:.55;background:radial-gradient(220px 120px at var(--lgx,50%) var(--lgy,0%),#fff8,transparent 68%),linear-gradient(125deg,transparent 25%,#ffffff1c 44%,transparent 58%);filter:url(#liquidGlassDistort);mix-blend-mode:screen;transition:opacity .25s ease}
.glass::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,#fff3,transparent 18%,transparent 70%,#fff1);box-shadow:inset 0 0 0 1px #ffffff12;opacity:.7}
@media(prefers-reduced-motion:reduce){.glass::before{transition:none}}
.lg-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
#hud{position:fixed;right:14px;top:calc(16px + env(safe-area-inset-top,0px));padding:7px 12px;border-radius:16px;font-size:13px;font-weight:600}
#sheet{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:10px 12px 12px;box-shadow:inset 0 1px 0 #ffffff66,0 18px 50px #0003}
#tabs{position:relative;display:flex;gap:4px;padding:4px;border-radius:20px;background:#0002;margin-bottom:10px;overflow:hidden;touch-action:none}
#tabs::before{content:"";position:absolute;left:4px;top:4px;height:calc(100% - 8px);width:calc((100% - 12px)/4);border-radius:16px;background:linear-gradient(135deg,#ffffff42,#ffffff12);border:1px solid #ffffff55;box-shadow:inset 0 1px 0 #ffffff66,0 5px 18px #0002;transform:translateX(var(--tab-x,0%));transition:transform .32s cubic-bezier(.22,.8,.25,1.06);pointer-events:none}
#tabs button{position:relative;z-index:1;flex:1;border:0;background:none;color:inherit;font:inherit;font-weight:700;padding:11px 4px;border-radius:16px;transition:transform .22s ease,opacity .22s ease}
#tabs button:not(.on){opacity:.72}
#tabs .on{opacity:1}
.pane{display:none;height:104px}.pane.on{display:block}
.pane p{margin:8px 2px 0;font-size:12.5px;opacity:.7}
.chips{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;padding:2px 2px 4px;scrollbar-width:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:46px;min-height:46px;border:1px solid var(--edge);background:#ffffff22;color:inherit;font:inherit;font-weight:600;padding:6px 14px;border-radius:16px}
.chip.on{background:color-mix(in srgb,var(--c1) 55%,transparent);border-color:var(--c1)}
.chip small{font-size:11px;font-weight:500;opacity:.75}
.chip i{width:12px;height:12px;border-radius:50%;display:block}
.skinGrid{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;touch-action:pan-x}
.skinCard{position:relative;flex:0 0 104px;height:92px;border:1px solid var(--edge);background:#ffffff18;color:inherit;border-radius:18px;overflow:hidden;padding:0;font:inherit;box-shadow:inset 0 1px 0 #ffffff35}
.skinCard img{width:100%;height:100%;object-fit:cover;display:block}
.skinCard span{position:absolute;left:6px;right:6px;bottom:5px;padding:4px 7px;border-radius:10px;background:#0009;color:#fff;font-size:12px;font-weight:800;text-align:center;backdrop-filter:blur(6px)}
.skinCard.on{border-color:var(--c1);box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 45%,transparent),inset 0 1px 0 #fff6}
.wr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wr b{font-size:30px;font-weight:800}
#wr{width:100%;margin:6px 0 0;accent-color:var(--c1);touch-action:auto}
#sheet{padding-top:8px}
.sheetTop{display:flex;justify-content:flex-end;height:42px;margin-bottom:4px}
#settingsBtn{position:static;height:36px;padding:0 14px;border:1px solid var(--edge);border-radius:14px;color:inherit;font:700 13px Onest,system-ui,sans-serif;z-index:12}
.settings{position:fixed;left:50%;bottom:calc(205px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100vw - 32px));box-sizing:border-box;padding:14px;z-index:13;opacity:0;pointer-events:none;transform:translate(-50%,8px) scale(.98);transition:.2s ease}
.settings.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.settingsHead{display:flex;align-items:center;justify-content:space-between;font-size:16px;margin-bottom:12px}
.settingsHead button{border:0;background:#ffffff18;color:inherit;border-radius:12px;width:34px;height:34px;font-size:22px}
.setting{display:block;padding:11px 2px;border-top:1px solid #ffffff18;font-size:13px}
.setting span{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.setting input[type=range]{width:100%;accent-color:var(--c1)}
.setting input[type=checkbox]{accent-color:var(--c1);float:right}

</style>

let skinEnabled=true;

addEventListener('resize',fit);fit();

function rb(w,h,d,r,mat,b){w-=2*b;h-=2*b;r=Math.max(.01,r-b);const x=-w/2,y=-h/2,sh=new THREE.Shape();

const skinMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5,metalness:.05,transparent:true,opacity:.38,depthWrite:false});
const skinOverlay=rb(3.55,7.15,.06,.5,skinMat,.03);

if(skinOpacity){
  const applySkinOpacity=()=>{

    skinMat.depthWrite=false;

    skinCanvasTexture.needsUpdate=true;
    skinMat.map=skinCanvasTexture;
    skinMat.needsUpdate=true;

let audioCtx=null;
let pressPlaying=false;
let soundEnabled=true, ambEnabled=true, smokeIntensity=1;
function playButtonSound(){
  if(!soundEnabled || !pressBuffer || pressPlaying)return;
  try{
    pressPlaying=true;
    pressSource=audioCtx.createBufferSource();
    pressSource.buffer=pressBuffer;
    pressSource.connect(audioCtx.destination);
    pressSource.onended=()=>{
      try{pressSource.disconnect()}catch(e){}
      pressPlaying=false;
      pressSource=null;
    };
    pressSource.start(0,1.5);
  }catch(e){
    pressPlaying=false;
    pressSource=null;
  }
}
function audioReady(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function uiSound(type='tap'){
  if(!soundEnabled)return;
  audioReady();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), n=audioCtx.currentTime;
  const f=type==='select'?480:type==='power'?240:620;
  o.type='sine';
  o.frequency.setValueAtTime(f,n);
  o.frequency.exponentialRampToValueAtTime(f*.8,n+.07);
  g.gain.setValueAtTime(.0001,n);
  g.gain.exponentialRampToValueAtTime(.028,n+.008);
  g.gain.exponentialRampToValueAtTime(.0001,n+.075);
  o.connect(g).connect(audioCtx.destination);
  o.start(n);o.stop(n+.08);
}

/* Neutral interface ambience, not a realistic inhalation/vaping sound. */
function ambience(){
  if(!ambEnabled)return;
  audioReady();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter(), n=audioCtx.currentTime;
  o.type='triangle'; o.frequency.setValueAtTime(150,n);
  o.frequency.exponentialRampToValueAtTime(105,n+.22);
  f.type='lowpass'; f.frequency.value=520;
  g.gain.setValueAtTime(.0001,n);
  g.gain.linearRampToValueAtTime(.018,n+.025);
  g.gain.exponentialRampToValueAtTime(.0001,n+.28);
  o.connect(f).connect(g).connect(audioCtx.destination);
  o.start(n);o.stop(n+.3);
}
